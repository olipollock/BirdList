name: Update eBird Life List

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 6am UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          EBIRD_EMAIL: ${{ secrets.EBIRD_EMAIL }}
          EBIRD_PASSWORD: ${{ secrets.EBIRD_PASSWORD }}
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: python scraper/scrape_lifelist.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/lifelist.json
          git diff --staged --quiet || git commit -m "Update life list $(date +%Y-%m-%d)"
          git push
